# Add inside your nginx server { } block for cleansameday.com
# Proxies /sitemap.xml to the backend API (live from database — no frontend redeploy needed).
#
# Requires backend route: GET http://127.0.0.1:4000/api/sitemap.xml
# Then: sudo nginx -t && sudo systemctl reload nginx

location = /sitemap.xml {
    proxy_pass http://127.0.0.1:4000/api/sitemap.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=900";
}
